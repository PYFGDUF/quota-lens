<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" fill="none" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Quota Lens System Architecture</title>
  <desc id="archDesc">Real-time data flow from Antigravity Language Server RPC and Session Transcripts to the Auxiliary Pane UI</desc>

  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d16" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <linearGradient id="nodeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="100%" stop-color="#0c101c" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="1200" height="260" rx="16" fill="url(#archBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Direct Header without Kicker -->
  <g transform="translate(48, 36)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" font-weight="700">实时精准归因架构 · 零外部依赖设计</text>
    <text x="0" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5">基于官方 ConnectRPC 与会话流日志的端到端数据流水线</text>
  </g>

  <!-- Flow Line Connecting Nodes -->
  <path d="M 270 156 L 360 156 M 580 156 L 670 156 M 890 156 L 980 156" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="360,153 368,156 360,159" fill="#38bdf8" />
  <polygon points="670,153 678,156 670,159" fill="#06b6d4" />
  <polygon points="980,153 988,156 980,159" fill="#10b981" />

  <!-- Node 1: Transcript Source -->
  <g transform="translate(48, 86)">
    <rect width="220" height="136" rx="12" fill="url(#nodeBg)" stroke="#1e293b" stroke-width="1" />
    <rect x="14" y="14" width="24" height="24" rx="6" fill="#1e293b" />
    <circle cx="26" cy="26" r="5" stroke="#60a5fa" stroke-width="1.8" fill="none" />
    <text x="46" y="30" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">会话日志提取</text>
    <text x="14" y="60" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10.5">transcript.jsonl</text>
    <text x="14" y="80" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" line-height="1.4">严格以 Prompt -&gt; Reply</text>
    <text x="14" y="98" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">切分独立问答轮次 (Turn)</text>
    <text x="14" y="118" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">Token &amp; 缓存命中率</text>
  </g>

  <!-- Node 2: Antigravity LS RPC -->
  <g transform="translate(360, 86)">
    <rect width="220" height="136" rx="12" fill="url(#nodeBg)" stroke="#1e293b" stroke-width="1" />
    <rect x="14" y="14" width="24" height="24" rx="6" fill="#1e293b" />
    <path d="M 20 23 L 32 23 M 20 29 L 28 29" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" />
    <text x="46" y="30" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Language Server</text>
    <text x="14" y="60" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10.5">ConnectRPC (HTTP/2)</text>
    <text x="14" y="80" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">直连官方 LS 服务端口</text>
    <text x="14" y="98" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">自动附带会话 CSRF 令牌</text>
    <text x="14" y="118" fill="#34d399" font-family="ui-monospace, monospace" font-size="10">权威 5h &amp; Weekly 分桶</text>
  </g>

  <!-- Node 3: Quota Lens Sidecar Engine -->
  <g transform="translate(670, 86)">
    <rect width="220" height="136" rx="12" fill="url(#nodeBg)" stroke="#1e293b" stroke-width="1" />
    <rect x="14" y="14" width="24" height="24" rx="6" fill="#1e293b" />
    <polyline points="20 28 24 23 28 27 32 21" stroke="#a78bfa" stroke-width="1.8" fill="none" />
    <text x="46" y="30" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Sidecar 归因引擎</text>
    <text x="14" y="60" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10.5">main.mjs (Zero-Dep)</text>
    <text x="14" y="80" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">动态差值与成本权重换算</text>
    <text x="14" y="98" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">双模型组支持 (Gemini/3P)</text>
    <text x="14" y="118" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="10">基准重设与持久化快照</text>
  </g>

  <!-- Node 4: Auxiliary Pane UI -->
  <g transform="translate(980, 86)">
    <rect width="172" height="136" rx="12" fill="url(#nodeBg)" stroke="#1e293b" stroke-width="1" />
    <rect x="14" y="14" width="24" height="24" rx="6" fill="#1e293b" />
    <rect x="20" y="20" width="12" height="12" rx="2" stroke="#38bdf8" stroke-width="1.5" />
    <text x="46" y="30" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">辅助面板 UI</text>
    <text x="14" y="60" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10.5">Auxiliary Pane</text>
    <text x="14" y="80" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">极简石板 IDE 原生质感</text>
    <text x="14" y="98" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">中英双语 / 秒级倒计时</text>
    <text x="14" y="118" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">纯矢量无 Emoji</text>
  </g>
</svg>
