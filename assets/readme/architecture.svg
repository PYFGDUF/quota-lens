<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Quota Lens — 配额归因架构 / Quota attribution architecture</title>
  <desc id="desc">Two independent local inputs converge in the Sidecar: official 5-hour and weekly quotas from the Antigravity Language Server via ConnectRPC, and turns, tokens and cache data from transcript.jsonl. The Sidecar computes quota deltas and weighted turn attribution, preserves baseline snapshots, and serves the native Auxiliary Pane with model groups, reset countdowns and bilingual UI.</desc>
  <rect width="1200" height="600" rx="12" fill="#191B1B"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, PingFang SC, Microsoft YaHei, sans-serif" font-weight="400">
    <text x="64" y="82" font-size="40" fill="#F1EFE9" letter-spacing="-1">配额归因 / Quota attribution</text>
    <text x="64" y="127" font-size="26" fill="#A5A8A3" >两路数据，本地归因，原生呈现。</text>
    <text x="64" y="190" font-size="16" fill="#A5A8A3" letter-spacing="1.4">01 / SOURCES</text>
    <text x="472" y="190" font-size="16" fill="#A5A8A3" letter-spacing="1.4">02 / SIDECAR</text>
    <text x="880" y="190" font-size="16" fill="#A5A8A3" letter-spacing="1.4">03 / NATIVE UI</text>
    <path d="M64 210H368 M64 366H368 M472 210H776 M880 210H1136" fill="none" stroke="#3A3D39"/>
    <text x="64" y="252" font-size="36" fill="#F1EFE9" >官方配额</text>
    <text x="64" y="287" font-size="20" fill="#A5A8A3" >Language Server · ConnectRPC</text>
    <text x="64" y="325" font-size="24" fill="#B8AA8D" >5-hour / Weekly</text>
    <text x="64" y="408" font-size="36" fill="#F1EFE9" >会话日志</text>
    <text x="64" y="443" font-size="22" fill="#A5A8A3" >transcript.jsonl</text>
    <text x="64" y="481" font-size="22" fill="#B8AA8D" >Turn · Tokens · Cache</text>
    <g id="data-connections" fill="none" stroke="#B8AA8D" stroke-width="1.5" stroke-linejoin="round">
      <path d="M376 289h36v78h52 M376 445h36v-78"/>
      <path d="m456 361 8 6-8 6 M784 367h80m-8-6 8 6-8 6"/>
    </g>
    <text x="472" y="285" font-size="36" fill="#F1EFE9" >本地归因引擎</text>
    <text x="472" y="320" font-size="22" fill="#A5A8A3" >Quota Lens Sidecar</text>
    <text x="472" y="388" font-size="20" fill="#B8AA8D" >Quota delta · Token weights</text>
    <text x="472" y="426" font-size="20" fill="#A5A8A3" >基准快照 / Baselines</text>
    <text x="472" y="462" font-size="20" fill="#A5A8A3" >零外部依赖 / Zero-dep</text>
    <text x="880" y="285" font-size="36" fill="#F1EFE9" >原生侧栏</text>
    <text x="880" y="320" font-size="22" fill="#A5A8A3" >Auxiliary Pane</text>
    <text x="880" y="388" font-size="22" fill="#B8AA8D" >Gemini / Claude / GPT</text>
    <text x="880" y="426" font-size="20" fill="#A5A8A3" >重置倒计时 / Resets</text>
    <text x="880" y="462" font-size="20" fill="#A5A8A3" >中文 / English</text>
    <path d="M64 528H1136" stroke="#3A3D39"/>
    <text x="64" y="566" font-size="16" fill="#A5A8A3" letter-spacing="0.6">LOCAL SIGNALS → TURN ATTRIBUTION → NATIVE VIEW</text>
  </g>
</svg>
