<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Quota Lens — Antigravity per-turn quota tracking</title>
  <desc id="desc">Per-turn 5-hour and weekly quota attribution. Illustrative example: one turn consumes 0.20% of the 5-hour quota and 0.05% of the weekly quota.</desc>
  <rect width="1200" height="440" rx="12" fill="#191B1B"/>

  <!-- Quiet shared identity; product-specific specimens below. -->
  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, PingFang SC, Microsoft YaHei, sans-serif">
    <circle cx="77" cy="59" r="11" fill="none" stroke="#A5A8A3" stroke-width="1.5"/>
    <path d="M77 48A11 11 0 0 1 88 59 M77 55V63 M73 59H81" fill="none" stroke="#B8AA8D" stroke-width="2"/>
    <text x="108" y="65" font-size="16" font-weight="400" fill="#A5A8A3" letter-spacing="2.4">ANTIGRAVITY</text>
    <text x="1136" y="65" font-size="16" font-weight="400" fill="#A5A8A3" text-anchor="end" letter-spacing="1.6">QUOTA &amp; TURNS</text>
    <text x="60" y="193" font-size="84" font-weight="500" fill="#F1EFE9" letter-spacing="-3.8">Quota Lens</text>
    <text x="64" y="253" font-size="30" font-weight="400" fill="#A5A8A3" letter-spacing="-0.5">Know what each turn costs.</text>
  </g>

  <path d="M696 127V328" stroke="#3A3D39"/>
  <g id="product-specimen" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="744" y="136" font-size="20" font-weight="400" fill="#A5A8A3" >One turn. Two windows.</text>
    <text x="744" y="211" font-size="23" font-weight="400" fill="#A5A8A3" >5-hour</text>
    <text x="1136" y="216" font-size="48" font-weight="400" fill="#B8AA8D" text-anchor="end" letter-spacing="-1.5">−0.20%</text>
    <path d="M744 244H1136" stroke="#3A3D39"/>
    <text x="744" y="295" font-size="23" font-weight="400" fill="#A5A8A3" >Weekly</text>
    <text x="1136" y="300" font-size="48" font-weight="400" fill="#B8AA8D" text-anchor="end" letter-spacing="-1.5">−0.05%</text>
  </g>

  <path d="M64 369H1136" stroke="#3A3D39"/>
  <g id="metadata" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="405" font-size="16" font-weight="400" fill="#A5A8A3" letter-spacing="0.7">PER-TURN ATTRIBUTION</text>
    <text x="1136" y="405" font-size="16" font-weight="400" fill="#A5A8A3" text-anchor="end" letter-spacing="0.7">ILLUSTRATIVE DATA</text>
  </g>
</svg>
