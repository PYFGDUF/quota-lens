<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <title>Quota Lens Logo</title>
  <defs>
    <linearGradient id="qGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Clean Dark Tile Base -->
  <rect width="64" height="64" rx="16" fill="#18181b" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Outer Viewfinder Frame -->
  <circle cx="32" cy="32" r="17" stroke="rgba(255, 255, 255, 0.18)" stroke-width="3" fill="none" />

  <!-- Active 90° Quota Quadrant Accent -->
  <path d="M 32 15 A 17 17 0 0 1 49 32" stroke="url(#qGradC)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Inner Concentric Lens Ring -->
  <circle cx="32" cy="32" r="7.5" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.8" fill="none" />

  <!-- Central Focal Dot -->
  <circle cx="32" cy="32" r="2.5" fill="#38bdf8" />
</svg>
